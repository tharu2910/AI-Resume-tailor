<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Resume Tailor for Grads</title>
<link rel="stylesheet" href="style.css">
<header id="nav" class="nav"></header>
<main>
  <div class="formbox">
    <h1>Log in</h1>
    <p class="notice">This is a demo login. There are no real accounts and no password. Enter any name and a valid-looking email. Your details stay in this browser.</p>
    <form id="form" novalidate>
      <label for="name">Name</label>
      <input id="name" type="text" autocomplete="name" placeholder="Meera K">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="meera.k@college.edu">
      <p class="error" id="err" role="alert"></p>
      <button class="button" id="go" type="submit">Log in</button>
    </form>
  </div>
</main>
<footer id="foot"></footer>
<script src="engine.js"></script>
<script src="mockapi.js"></script>
<script src="app.js"></script>
<script>
renderNav("login.html");
if(MockAPI.currentUser()){ window.location.href = "dashboard.html"; }
$("form").addEventListener("submit", function(e){
  e.preventDefault();
  var btn = $("go"); btn.disabled = true; btn.textContent = "Logging in..."; $("err").textContent = "";
  MockAPI.login($("name").value, $("email").value).then(function(){
    window.location.href = "dashboard.html";
  }, function(err){
    $("err").textContent = err.message; btn.disabled = false; btn.textContent = "Log in";
  });
});
</script>
